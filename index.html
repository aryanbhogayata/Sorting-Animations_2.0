<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprehensive Sorting Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }

      .array-bar {
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      /* Smooth transitions for both position (swaps) and height (overwrites) */
      .transition-position {
        transition:
          left 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          height 0.3s ease-in-out,
          background-color 0.3s ease;
      }

      .marker-transition {
        transition:
          left 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.3s ease;
      }

      .pointer {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-weight: bold;
        font-size: 0.875rem;
        z-index: 10;
      }

      .pointer-arrow {
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 8px solid;
        margin-bottom: 4px;
      }

      /* Status styles for bars */
      .bar-default {
        background-color: #3b82f6;
      } /* blue-500 */
      .bar-comparing {
        background-color: #eab308;
      } /* yellow-500 */
      .bar-swapping {
        background-color: #a855f7;
      } /* purple-500 */
      .bar-sorted {
        background-color: #22c55e;
      } /* green-500 */
      .bar-special {
        background-color: #ef4444;
      } /* red-500 (Pivot/Min/Root) */
      .bar-inactive {
        opacity: 0.3;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-8 flex-grow flex flex-col">
      <header class="mb-6 text-center">
        <h1
          class="text-3xl md:text-4xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500"
          id="main-title"
        >
          Algorithm Visualizer
        </h1>
        <p
          class="text-slate-400 max-w-3xl mx-auto text-sm md:text-base"
          id="main-desc"
        >
          Select an algorithm to learn how it works step-by-step.
        </p>
      </header>

      <div class="flex flex-col lg:flex-row gap-6 flex-grow">
        <!-- Left Column: Visualization & Controls -->
        <div class="w-full lg:w-2/3 flex flex-col gap-6">
          <!-- Controls (Top) -->
          <div
            class="bg-slate-800 rounded-xl p-4 md:p-6 border border-slate-700 shadow-xl flex flex-col gap-4"
          >
            <!-- Top Row: Algorithm Selection -->
            <div class="flex flex-wrap items-center gap-4">
              <label for="algo-select" class="font-semibold text-slate-300"
                >Algorithm:</label
              >
              <select
                id="algo-select"
                class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 font-medium"
              >
                <option value="quick">Quick Sort (Hoare)</option>
                <option value="bubble">Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="heap">Heap Sort</option>
                <option value="bucket">Bucket Sort</option>
                <option value="radix">Radix Sort</option>
              </select>
            </div>

            <div class="h-px bg-slate-700 w-full"></div>

            <!-- Bottom Row: Array Generation & Playback -->
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div class="flex flex-wrap gap-2 items-center">
                <button
                  id="btn-reset"
                  class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition-colors border border-slate-600 text-sm whitespace-nowrap"
                >
                  Random Array
                </button>
                <div class="flex items-center gap-1">
                  <input
                    type="text"
                    id="custom-array-input"
                    placeholder="e.g. 45, 12, 89"
                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 w-32 sm:w-40 placeholder-slate-500"
                  />
                  <button
                    id="btn-load-custom"
                    class="px-3 py-2 bg-slate-700 hover:bg-blue-600 rounded-lg font-medium transition-colors border border-slate-600 text-sm"
                  >
                    Load
                  </button>
                </div>
              </div>

              <div
                class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-lg border border-slate-700"
              >
                <button
                  id="btn-step-prev"
                  class="p-2 hover:bg-slate-700 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-slate-300"
                  title="Previous Step"
                  disabled
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 19l-7-7 7-7"
                    ></path>
                  </svg>
                </button>

                <button
                  id="btn-play-pause"
                  class="p-2 bg-blue-600 hover:bg-blue-500 rounded-md transition-colors text-white flex items-center justify-center w-8 h-8"
                >
                  <svg
                    id="icon-play"
                    class="w-4 h-4"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                  <svg
                    id="icon-pause"
                    class="w-4 h-4 hidden"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </button>

                <button
                  id="btn-step-next"
                  class="p-2 hover:bg-slate-700 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-slate-300"
                  title="Next Step"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 5l7 7-7 7"
                    ></path>
                  </svg>
                </button>
              </div>

              <div class="flex flex-col">
                <label for="speed-slider" class="text-slate-400 text-xs mb-1"
                  >Speed</label
                >
                <input
                  type="range"
                  id="speed-slider"
                  min="50"
                  max="1500"
                  value="600"
                  class="w-24 accent-blue-500"
                  dir="rtl"
                />
              </div>
            </div>
          </div>

          <!-- Visualization Canvas -->
          <div
            class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl relative overflow-hidden flex-grow flex flex-col justify-between"
            style="min-height: 400px"
          >
            <div
              id="visualization-area"
              class="relative w-full h-full flex-grow mt-4"
            >
              <!-- Indices Layer -->
              <div
                id="indices-container"
                class="absolute top-0 left-0 w-full h-6 text-slate-400 font-mono text-xs sm:text-sm font-semibold"
              ></div>

              <!-- Array Items -->
              <div
                id="array-container"
                class="absolute bottom-16 left-0 w-full top-8"
              ></div>

              <!-- Dynamic Pointers Layer -->
              <div
                id="markers-container"
                class="absolute bottom-0 left-0 w-full h-14"
              ></div>
            </div>

            <!-- Legend -->
            <div
              class="mt-4 flex flex-wrap justify-center gap-4 text-xs font-medium text-slate-300 bg-slate-900/50 p-2 rounded-lg"
            >
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bar-default"></div>
                Standard
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bar-comparing"></div>
                Comparing/Active
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bar-swapping"></div>
                Modifying
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bar-special"></div>
                Target/Special
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bar-sorted"></div>
                Sorted
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Explanations -->
        <div class="w-full lg:w-1/3 flex flex-col gap-4">
          <div
            class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl overflow-hidden flex flex-col h-full"
          >
            <div
              class="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center"
            >
              <h2 class="font-semibold text-lg flex items-center gap-2">
                <svg
                  class="w-5 h-5 text-blue-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                Algorithm Step
              </h2>
              <span
                id="step-counter"
                class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300 font-mono"
                >Step 0 / 0</span
              >
            </div>

            <div class="p-5 flex-grow overflow-y-auto">
              <div
                id="explanation-text"
                class="text-base md:text-lg leading-relaxed space-y-4"
              >
                <!-- Explanation injected here -->
              </div>
            </div>

            <!-- Dynamic Variables Monitor -->
            <div class="bg-slate-900 p-4 border-t border-slate-700">
              <div
                class="text-xs text-slate-400 mb-2 uppercase tracking-wider font-bold"
              >
                Variable Monitor
              </div>
              <div
                id="variables-monitor"
                class="grid grid-cols-2 md:grid-cols-3 gap-3 text-center"
              >
                <!-- Dynamically injected variables -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer style="text-align: center">&copy; Aryan A. Bhogayata</footer>

    <script>
      const ARRAY_SIZE = 12;
      const MIN_VAL = 10;
      const MAX_VAL = 99;
      const GAP_PX = 8;

      // Algorithm metadata for UI
      const algorithms = {
        quick: {
          title: "Quick Sort (Hoare Partition)",
          desc: "Picks the first element as a pivot. Scans from both ends (i and j), swapping elements that are on the wrong side of the pivot, until pointers cross.",
          generator: generateQuickSortSteps,
        },
        bubble: {
          title: "Bubble Sort",
          desc: "Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order. The largest elements 'bubble' to the top.",
          generator: generateBubbleSortSteps,
        },
        selection: {
          title: "Selection Sort",
          desc: "Divides the input list into two parts: a sorted sublist and an unsorted sublist. Repeatedly finds the minimum element from the unsorted part and puts it at the beginning.",
          generator: generateSelectionSortSteps,
        },
        insertion: {
          title: "Insertion Sort",
          desc: "Builds the final sorted array one item at a time. It takes each element and slides it backwards into its proper place among the already sorted elements.",
          generator: generateInsertionSortSteps,
        },
        merge: {
          title: "Merge Sort",
          desc: "A divide-and-conquer algorithm that divides the array into halves, recursively sorts them, and then merges the sorted halves back together.",
          generator: generateMergeSortSteps,
        },
        heap: {
          title: "Heap Sort",
          desc: "Converts the array into a Max-Heap structure, then repeatedly swaps the largest element (root) with the last element of the heap and reduces the heap size.",
          generator: generateHeapSortSteps,
        },
        bucket: {
          title: "Bucket Sort",
          desc: "Distributes elements into a number of 'buckets' based on value. Each bucket is then sorted individually, and then they are gathered sequentially.",
          generator: generateBucketSortSteps,
        },
        radix: {
          title: "Radix Sort (LSD)",
          desc: "Sorts numbers digit by digit, starting from the least significant digit (LSD) to the most significant, using a stable sort like counting sort underneath.",
          generator: generateRadixSortSteps,
        },
      };

      // Global State
      let currentAlgoId = "quick";
      let originalArray = []; // Array of objects {id, val}
      let steps = [];
      let currentStepIndex = -1;
      let isPlaying = false;
      let playInterval = null;
      let speedMs = 600;

      // DOM References
      const arrayContainer = document.getElementById("array-container");
      const indicesContainer = document.getElementById("indices-container");
      const markersContainer = document.getElementById("markers-container");
      const explanationText = document.getElementById("explanation-text");
      const stepCounter = document.getElementById("step-counter");
      const varsMonitor = document.getElementById("variables-monitor");
      const algoSelect = document.getElementById("algo-select");
      const mainTitle = document.getElementById("main-title");
      const mainDesc = document.getElementById("main-desc");
      const btnPlayPause = document.getElementById("btn-play-pause");
      const iconPlay = document.getElementById("icon-play");
      const iconPause = document.getElementById("icon-pause");

      function init() {
        setupEventListeners();
        handleAlgoChange(); // Triggers array generation and step calculation
      }

      function setupEventListeners() {
        document.getElementById("btn-reset").addEventListener("click", () => {
          generateNewArray();
          resetState();
        });
        document
          .getElementById("btn-load-custom")
          .addEventListener("click", loadCustomArray);
        document
          .getElementById("custom-array-input")
          .addEventListener("keypress", (e) => {
            if (e.key === "Enter") loadCustomArray();
          });

        algoSelect.addEventListener("change", (e) => {
          currentAlgoId = e.target.value;
          handleAlgoChange();
        });

        document
          .getElementById("btn-step-next")
          .addEventListener("click", () => {
            pauseAnimation();
            nextStep();
          });
        document
          .getElementById("btn-step-prev")
          .addEventListener("click", () => {
            pauseAnimation();
            prevStep();
          });
        btnPlayPause.addEventListener("click", togglePlay);

        document
          .getElementById("speed-slider")
          .addEventListener("input", (e) => {
            speedMs = parseInt(e.target.value);
            if (isPlaying) {
              pauseAnimation();
              playAnimation();
            }
          });

        window.addEventListener("resize", () => {
          if (currentStepIndex >= 0 && currentStepIndex < steps.length) {
            renderMarkers(steps[currentStepIndex].markers);
          }
        });
      }

      function handleAlgoChange() {
        const meta = algorithms[currentAlgoId];
        mainTitle.textContent = meta.title;
        mainDesc.textContent = meta.desc;
        if (originalArray.length === 0) {
          generateNewArray();
        }
        resetState();
      }

      function generateNewArray() {
        originalArray = [];
        for (let i = 0; i < ARRAY_SIZE; i++) {
          originalArray.push({
            id: `block-${Date.now()}-${i}`,
            val: Math.floor(Math.random() * (MAX_VAL - MIN_VAL + 1)) + MIN_VAL,
          });
        }
        document.getElementById("custom-array-input").value = "";
      }

      function loadCustomArray() {
        const inputVal = document.getElementById("custom-array-input").value;
        if (!inputVal) return;
        const parsedArray = inputVal
          .split(",")
          .map((item) => parseInt(item.trim(), 10))
          .filter((item) => !isNaN(item) && item >= 0);

        if (parsedArray.length === 0 || parsedArray.length > 20) {
          explanationText.innerHTML = `<p class="text-red-400 font-medium">Invalid input. Please enter 1-20 positive numbers separated by commas.</p>`;
          return;
        }

        originalArray = parsedArray.map((val, idx) => ({
          id: `custom-${Date.now()}-${idx}`,
          val: val,
        }));
        resetState();
      }

      function resetState() {
        pauseAnimation();
        steps = [];
        currentStepIndex = -1;

        // Ensure DOM elements start fresh
        renderInitialDOM(originalArray);

        // Generate steps using selected algorithm
        algorithms[currentAlgoId].generator([...originalArray]);

        document.getElementById("btn-step-prev").disabled = true;
        document.getElementById("btn-step-next").disabled = false;
        stepCounter.textContent = `Step 0 / ${steps.length}`;
        explanationText.innerHTML = `<p>Ready to execute <strong class="text-blue-400">${algorithms[currentAlgoId].title}</strong>.</p><p>Click Play or Next Step.</p>`;
        varsMonitor.innerHTML = "";
      }

      // Helper to record a snapshot of the algorithm's state
      function record(
        arr,
        activeIndices,
        sortedIndices,
        specialIndices,
        markers,
        msg,
        action,
      ) {
        // Deep copy the array state (preserving ID to value mapping)
        const arrSnapshot = arr.map((item) => ({ id: item.id, val: item.val }));
        steps.push({
          array: arrSnapshot,
          activeIndices: activeIndices || [], // Indices currently being processed (yellow)
          sortedIndices: new Set(sortedIndices), // Indices known to be sorted (green)
          specialIndices: specialIndices || [], // Special elements like Pivot/Min (red)
          markers: markers || [], // Pointers (e.g., {label: 'i', idx: 2, color: '#c084fc'})
          message: msg,
          action: action || "idle", // 'swap', 'compare', 'overwrite'
        });
      }

      function swap(arr, i, j) {
        let temp = arr[i];
        arr[i] = arr[j];
        arr[j] = temp;
      }

      function generateQuickSortSteps(arr) {
        let sorted = new Set();

        function partition(low, high) {
          let pivotVal = arr[low].val;
          let i = low - 1;
          let j = high + 1;

          record(
            arr,
            [],
            sorted,
            [low],
            [{ label: "P", idx: low, color: "#f87171" }],
            `Partition range [${low} to ${high}]. Chosen Pivot is <span class="font-mono text-red-400">${pivotVal}</span>.`,
            "idle",
          );

          while (true) {
            do {
              i++;
              record(
                arr,
                [i],
                sorted,
                [low],
                [
                  { label: "P", idx: low, color: "#f87171" },
                  { label: "i", idx: i, color: "#c084fc" },
                  { label: "j", idx: j, color: "#fbbf24" },
                ],
                `Scanning right with <span class="text-purple-400 font-bold">i</span>. Is ${arr[i].val} >= Pivot (${pivotVal})?`,
                "compare",
              );
            } while (arr[i].val < pivotVal);

            do {
              j--;
              record(
                arr,
                [j],
                sorted,
                [low],
                [
                  { label: "P", idx: low, color: "#f87171" },
                  { label: "i", idx: i, color: "#c084fc" },
                  { label: "j", idx: j, color: "#fbbf24" },
                ],
                `Scanning left with <span class="text-amber-400 font-bold">j</span>. Is ${arr[j].val} <= Pivot (${pivotVal})?`,
                "compare",
              );
            } while (arr[j].val > pivotVal);

            if (i >= j) {
              record(
                arr,
                [],
                sorted,
                [low],
                [
                  { label: "P", idx: low, color: "#f87171" },
                  { label: "i", idx: i, color: "#c084fc" },
                  { label: "j", idx: j, color: "#fbbf24" },
                ],
                `<span class="text-purple-400">i</span> (${i}) crossed/met <span class="text-amber-400">j</span> (${j}). Partition complete at index ${j}.`,
                "idle",
              );
              return j;
            }

            record(
              arr,
              [i, j],
              sorted,
              [low],
              [
                { label: "P", idx: low, color: "#f87171" },
                { label: "i", idx: i, color: "#c084fc" },
                { label: "j", idx: j, color: "#fbbf24" },
              ],
              `Found elements on wrong side of pivot. Swapping them.`,
              "idle",
            );
            swap(arr, i, j);
            record(
              arr,
              [i, j],
              sorted,
              [low],
              [
                { label: "P", idx: low, color: "#f87171" },
                { label: "i", idx: i, color: "#c084fc" },
                { label: "j", idx: j, color: "#fbbf24" },
              ],
              `Swapped elements at i and j.`,
              "swap",
            );
          }
        }

        function quickSort(low, high) {
          if (low < high) {
            let pi = partition(low, high);
            quickSort(low, pi);
            quickSort(pi + 1, high);
          } else if (low === high) {
            sorted.add(low);
          }
        }
        quickSort(0, arr.length - 1);
        for (let k = 0; k < arr.length; k++) sorted.add(k);
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Quick Sort Complete!</strong>`,
          "complete",
        );
      }

      function generateBubbleSortSteps(arr) {
        let sorted = new Set();
        let n = arr.length;
        for (let i = 0; i < n - 1; i++) {
          for (let j = 0; j < n - i - 1; j++) {
            let m = [
              { label: "j", idx: j, color: "#fbbf24" },
              { label: "j+1", idx: j + 1, color: "#c084fc" },
            ];
            record(
              arr,
              [j, j + 1],
              sorted,
              [],
              m,
              `Comparing elements at index ${j} and ${j + 1}.`,
              "compare",
            );
            if (arr[j].val > arr[j + 1].val) {
              swap(arr, j, j + 1);
              record(
                arr,
                [j, j + 1],
                sorted,
                [],
                m,
                `<span class="font-mono">${arr[j + 1].val}</span> > <span class="font-mono">${arr[j].val}</span>, so we swap them.`,
                "swap",
              );
            }
          }
          sorted.add(n - i - 1);
          record(
            arr,
            [],
            sorted,
            [],
            [],
            `Largest element bubbled to the end.`,
            "idle",
          );
        }
        sorted.add(0);
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Bubble Sort Complete!</strong>`,
          "complete",
        );
      }

      function generateSelectionSortSteps(arr) {
        let sorted = new Set();
        let n = arr.length;
        for (let i = 0; i < n - 1; i++) {
          let minIdx = i;
          let m = [
            { label: "i", idx: i, color: "#22c55e" },
            { label: "Min", idx: minIdx, color: "#f87171" },
          ];
          record(
            arr,
            [i],
            sorted,
            [minIdx],
            m,
            `Starting pass ${i}. Assuming min is at index ${i}.`,
            "idle",
          );

          for (let j = i + 1; j < n; j++) {
            m = [
              { label: "i", idx: i, color: "#22c55e" },
              { label: "Min", idx: minIdx, color: "#f87171" },
              { label: "j", idx: j, color: "#fbbf24" },
            ];
            record(
              arr,
              [j],
              sorted,
              [minIdx],
              m,
              `Scanning with j... comparing ${arr[j].val} to current min ${arr[minIdx].val}.`,
              "compare",
            );

            if (arr[j].val < arr[minIdx].val) {
              minIdx = j;
              m = [
                { label: "i", idx: i, color: "#22c55e" },
                { label: "Min", idx: minIdx, color: "#f87171" },
                { label: "j", idx: j, color: "#fbbf24" },
              ];
              record(
                arr,
                [],
                sorted,
                [minIdx],
                m,
                `Found new minimum: <span class="font-mono">${arr[minIdx].val}</span> at index ${minIdx}.`,
                "idle",
              );
            }
          }
          if (minIdx !== i) {
            m = [
              { label: "i", idx: i, color: "#22c55e" },
              { label: "Min", idx: minIdx, color: "#f87171" },
            ];
            record(
              arr,
              [i, minIdx],
              sorted,
              [],
              m,
              `Pass complete. Swapping current index ${i} with min at ${minIdx}.`,
              "idle",
            );
            swap(arr, i, minIdx);
            record(arr, [i, minIdx], sorted, [], m, `Swapped.`, "swap");
          }
          sorted.add(i);
        }
        sorted.add(n - 1);
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Selection Sort Complete!</strong>`,
          "complete",
        );
      }

      function generateInsertionSortSteps(arr) {
        let sorted = new Set([0]); // First element is considered sorted initially
        let n = arr.length;
        for (let i = 1; i < n; i++) {
          let j = i;
          let m = [{ label: "i", idx: i, color: "#f87171" }];
          record(
            arr,
            [i],
            sorted,
            [i],
            m,
            `Taking element <span class="font-mono">${arr[i].val}</span> to insert into sorted portion.`,
            "idle",
          );

          // We use adjacent swaps to visually mimic insertion for the blocks
          while (j > 0 && arr[j - 1].val > arr[j].val) {
            m = [
              { label: "cmp", idx: j - 1, color: "#fbbf24" },
              { label: "mv", idx: j, color: "#c084fc" },
            ];
            record(
              arr,
              [j - 1, j],
              sorted,
              [],
              m,
              `${arr[j - 1].val} > ${arr[j].val}, swapping backwards.`,
              "compare",
            );
            swap(arr, j, j - 1);
            record(arr, [j - 1, j], sorted, [], m, `Moved left.`, "swap");
            j--;
          }
          sorted.add(i); // Update full sorted boundary visually
          record(
            arr,
            [],
            sorted,
            [],
            [],
            `Element placed in correct sorted order.`,
            "idle",
          );
        }
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Insertion Sort Complete!</strong>`,
          "complete",
        );
      }

      function generateHeapSortSteps(arr) {
        let sorted = new Set();
        let n = arr.length;

        function heapify(n, i) {
          let largest = i;
          let l = 2 * i + 1;
          let r = 2 * i + 2;

          let m = [{ label: "curr", idx: i, color: "#c084fc" }];
          if (l < n) m.push({ label: "L", idx: l, color: "#fbbf24" });
          if (r < n) m.push({ label: "R", idx: r, color: "#fbbf24" });

          record(
            arr,
            [i, l, r].filter((x) => x < n),
            sorted,
            [largest],
            m,
            `Heapifying at node ${i}. Checking children.`,
            "compare",
          );

          if (l < n && arr[l].val > arr[largest].val) largest = l;
          if (r < n && arr[r].val > arr[largest].val) largest = r;

          if (largest !== i) {
            m = [
              { label: "root", idx: i, color: "#f87171" },
              { label: "lgst", idx: largest, color: "#22c55e" },
            ];
            record(
              arr,
              [i, largest],
              sorted,
              [],
              m,
              `Swapping with largest child.`,
              "idle",
            );
            swap(arr, i, largest);
            record(arr, [i, largest], sorted, [], m, `Swapped.`, "swap");
            heapify(n, largest);
          }
        }

        // Build max heap
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `Phase 1: Building Max Heap from bottom up.`,
          "idle",
        );
        for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
          heapify(n, i);
        }

        // Extract elements
        for (let i = n - 1; i > 0; i--) {
          let m = [
            { label: "Root(Max)", idx: 0, color: "#f87171" },
            { label: "End", idx: i, color: "#c084fc" },
          ];
          record(
            arr,
            [0, i],
            sorted,
            [0],
            m,
            `Max element is at root. Swapping with end of heap (index ${i}).`,
            "idle",
          );
          swap(arr, 0, i);
          record(arr, [0, i], sorted, [], m, `Swapped root to end.`, "swap");

          sorted.add(i); // Now sorted
          record(
            arr,
            [],
            sorted,
            [],
            [],
            `Element placed. Reducing heap size and fixing root.`,
            "idle",
          );
          heapify(i, 0);
        }
        sorted.add(0);
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Heap Sort Complete!</strong>`,
          "complete",
        );
      }

      // For these, elements don't just swap. They overwrite array positions.
      // We modify arr[idx].val directly.
      function generateMergeSortSteps(arr) {
        let sorted = new Set();

        function merge(l, m, r) {
          let n1 = m - l + 1;
          let n2 = r - m;
          let L = new Array(n1),
            R = new Array(n2);

          for (let i = 0; i < n1; i++) L[i] = arr[l + i].val;
          for (let j = 0; j < n2; j++) R[j] = arr[m + 1 + j].val;

          let i = 0,
            j = 0,
            k = l;

          let mrks = [
            { label: "L", idx: l, color: "#c084fc" },
            { label: "R", idx: r, color: "#c084fc" },
            { label: "k", idx: k, color: "#f87171" },
          ];
          record(
            arr,
            [],
            sorted,
            [],
            mrks,
            `Merging subarrays [${l}...${m}] and [${m + 1}...${r}].`,
            "idle",
          );

          while (i < n1 && j < n2) {
            if (L[i] <= R[j]) {
              arr[k].val = L[i];
              i++;
            } else {
              arr[k].val = R[j];
              j++;
            }
            mrks = [{ label: "k", idx: k, color: "#f87171" }];
            record(
              arr,
              [k],
              sorted,
              [],
              mrks,
              `Overwriting index ${k} with smaller value: <span class="font-mono">${arr[k].val}</span>.`,
              "overwrite",
            );
            k++;
          }

          while (i < n1) {
            arr[k].val = L[i];
            mrks = [{ label: "k", idx: k, color: "#f87171" }];
            record(
              arr,
              [k],
              sorted,
              [],
              mrks,
              `Copying remaining left half value ${arr[k].val} to index ${k}.`,
              "overwrite",
            );
            i++;
            k++;
          }
          while (j < n2) {
            arr[k].val = R[j];
            mrks = [{ label: "k", idx: k, color: "#f87171" }];
            record(
              arr,
              [k],
              sorted,
              [],
              mrks,
              `Copying remaining right half value ${arr[k].val} to index ${k}.`,
              "overwrite",
            );
            j++;
            k++;
          }
        }

        function mergeSortRec(l, r) {
          if (l >= r) return;
          let m = l + parseInt((r - l) / 2);
          mergeSortRec(l, m);
          mergeSortRec(m + 1, r);
          merge(l, m, r);
        }

        mergeSortRec(0, arr.length - 1);
        for (let i = 0; i < arr.length; i++) sorted.add(i);
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Merge Sort Complete!</strong>`,
          "complete",
        );
      }

      function generateBucketSortSteps(arr) {
        let sorted = new Set();
        let n = arr.length;

        let buckets = Array.from({ length: 10 }, () => []);

        record(
          arr,
          [],
          sorted,
          [],
          [],
          `Distributing elements into 10 buckets based on tens digit (e.g., 45 -> Bucket 4).`,
          "idle",
        );

        for (let i = 0; i < n; i++) {
          let val = arr[i].val;
          let bucketIdx = Math.min(Math.floor(val / 10), 9);
          buckets[bucketIdx].push(val);
          let m = [{ label: "curr", idx: i, color: "#c084fc" }];
          record(
            arr,
            [i],
            sorted,
            [],
            m,
            `Element ${val} placed in conceptual Bucket ${bucketIdx}.`,
            "idle",
          );
        }

        record(
          arr,
          [],
          sorted,
          [],
          [],
          `Sorting individual buckets in background...`,
          "idle",
        );
        for (let i = 0; i < 10; i++) buckets[i].sort((a, b) => a - b);

        let k = 0;
        for (let i = 0; i < 10; i++) {
          if (buckets[i].length > 0) {
            record(
              arr,
              [],
              sorted,
              [],
              [],
              `Gathering elements from Bucket ${i}...`,
              "idle",
            );
            for (let j = 0; j < buckets[i].length; j++) {
              arr[k].val = buckets[i][j];
              let m = [{ label: "Write", idx: k, color: "#22c55e" }];
              record(
                arr,
                [k],
                sorted,
                [],
                m,
                `Overwriting index ${k} with ${arr[k].val} from Bucket ${i}.`,
                "overwrite",
              );
              sorted.add(k);
              k++;
            }
          }
        }
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Bucket Sort Complete!</strong>`,
          "complete",
        );
      }

      function generateRadixSortSteps(arr) {
        let sorted = new Set();
        let n = arr.length;
        let maxVal = Math.max(...arr.map((x) => x.val));

        function countingSort(exp) {
          let output = new Array(n);
          let count = new Array(10).fill(0);

          record(
            arr,
            [],
            sorted,
            [],
            [],
            `Counting Sort for digit place: <span class="font-bold text-blue-400">10^${Math.log10(exp)}</span>...`,
            "idle",
          );

          for (let i = 0; i < n; i++) {
            let digit = Math.floor(arr[i].val / exp) % 10;
            count[digit]++;
          }
          for (let i = 1; i < 10; i++) {
            count[i] += count[i - 1];
          }

          for (let i = n - 1; i >= 0; i--) {
            let digit = Math.floor(arr[i].val / exp) % 10;
            output[count[digit] - 1] = arr[i].val;
            count[digit]--;
          }

          for (let i = 0; i < n; i++) {
            arr[i].val = output[i];
            let m = [{ label: "Write", idx: i, color: "#f87171" }];
            record(
              arr,
              [i],
              sorted,
              [],
              m,
              `Writing ${arr[i].val} back to array for this digit pass.`,
              "overwrite",
            );
          }
        }

        for (let exp = 1; Math.floor(maxVal / exp) > 0; exp *= 10) {
          countingSort(exp);
        }

        for (let i = 0; i < n; i++) sorted.add(i);
        record(
          arr,
          [],
          sorted,
          [],
          [],
          `<strong>Radix Sort Complete!</strong>`,
          "complete",
        );
      }

      function getLeftPos(index, totalItems) {
        return `calc((${index} * ((100% - ${(totalItems - 1) * GAP_PX}px) / ${totalItems})) + (${index} * ${GAP_PX}px))`;
      }

      function getWidth(totalItems) {
        return `calc((100% - ${(totalItems - 1) * GAP_PX}px) / ${totalItems})`;
      }

      function renderInitialDOM(arr) {
        arrayContainer.innerHTML = "";
        indicesContainer.innerHTML = "";
        markersContainer.innerHTML = "";

        const maxVal = Math.max(...arr.map((a) => a.val), 1);
        const itemWidth = getWidth(arr.length);

        arr.forEach((item, idx) => {
          // Static index labels
          const indexLabel = document.createElement("div");
          indexLabel.className =
            "absolute text-center flex justify-center w-full";
          indexLabel.style.width = itemWidth;
          indexLabel.style.left = getLeftPos(idx, arr.length);
          indexLabel.innerText = idx;
          indicesContainer.appendChild(indexLabel);

          // Physical block elements mapped by unique ID
          const bar = document.createElement("div");
          bar.id = item.id;
          const heightPct = Math.max((item.val / maxVal) * 100, 15); // min 15% height

          bar.className =
            "array-bar bar-default rounded-t-md flex items-end justify-center pb-2 font-mono font-bold text-sm sm:text-base text-white absolute bottom-0 transition-position";
          bar.style.width = itemWidth;
          bar.style.height = `${heightPct}%`;
          bar.style.left = getLeftPos(idx, arr.length);
          bar.innerText = item.val;

          arrayContainer.appendChild(bar);
        });
      }

      function renderStep(stepIndex) {
        if (stepIndex < 0 || stepIndex >= steps.length) return;

        const step = steps[stepIndex];
        const arrState = step.array;
        const maxVal = Math.max(...arrState.map((a) => a.val), 1); // Used for overwrite height recalcs

        stepCounter.textContent = `Step ${stepIndex + 1} / ${steps.length}`;
        explanationText.innerHTML = `<p>${step.message}</p>`;

        // Update Variables Monitor UI dynamically
        varsMonitor.innerHTML = "";
        step.markers.forEach((m) => {
          let el = document.createElement("div");
          el.className = "bg-slate-800 p-2 rounded border border-slate-700";
          el.innerHTML = `
                <div class="text-xs font-bold mb-1" style="color: ${m.color}">${m.label}</div>
                <div class="text-xl font-mono text-white">${m.idx !== -1 ? m.idx : "-"}</div>
            `;
          varsMonitor.appendChild(el);
        });
        if (step.markers.length === 0) {
          varsMonitor.innerHTML = `<div class="col-span-full text-slate-500 text-sm">No active pointers</div>`;
        }

        // Apply visual updates to Blocks
        arrState.forEach((item, arrIdx) => {
          const bar = document.getElementById(item.id);
          if (!bar) return;

          // Update Left Position (Handles Swaps)
          bar.style.left = getLeftPos(arrIdx, arrState.length);

          // Update Height/Text (Handles Overwrites for Merge/Bucket/Radix)
          if (step.action === "overwrite") {
            const heightPct = Math.max((item.val / maxVal) * 100, 15);
            bar.style.height = `${heightPct}%`;
            bar.innerText = item.val;
          }

          // Determine classes
          let baseClasses =
            "array-bar rounded-t-md flex items-end justify-center pb-2 font-mono font-bold text-sm sm:text-base text-white absolute bottom-0 transition-position ";

          if (step.sortedIndices.has(arrIdx)) {
            bar.className = baseClasses + "bar-sorted";
          } else if (step.specialIndices.includes(arrIdx)) {
            bar.className = baseClasses + "bar-special";
          } else if (step.activeIndices.includes(arrIdx)) {
            if (step.action === "swap" || step.action === "overwrite") {
              bar.className = baseClasses + "bar-swapping";
            } else {
              bar.className = baseClasses + "bar-comparing";
            }
          } else if (
            step.action !== "complete" &&
            step.activeIndices.length > 0
          ) {
            bar.className = baseClasses + "bar-default bar-inactive";
          } else {
            bar.className = baseClasses + "bar-default";
          }
        });

        renderMarkers(step.markers);
      }

      function renderMarkers(markersData) {
        // Clear old markers logically
        const existingMarkers = document.querySelectorAll(".pointer");
        existingMarkers.forEach((el) => (el.style.opacity = "0"));

        const arrLength = originalArray.length;
        const itemWidth = getWidth(arrLength);

        markersData.forEach((m, i) => {
          const id = `marker-dynamic-${m.label.replace(/\s+/g, "-")}`;
          let el = document.getElementById(id);

          if (!el) {
            el = document.createElement("div");
            el.id = id;
            el.className = `pointer marker-transition absolute top-0`;
            el.style.color = m.color;
            el.innerHTML = `<div class="pointer-arrow" style="border-bottom-color: ${m.color}"></div><div>${m.label}</div>`;
            markersContainer.appendChild(el);
          }

          if (m.idx >= 0 && m.idx < arrLength) {
            el.style.opacity = "1";
            // Calculate slightly staggered Y offsets if multiple markers share the same index
            const offset =
              markersData.filter((x, idx) => x.idx === m.idx && idx < i)
                .length * 14;

            const itemLeft = getLeftPos(m.idx, arrLength);
            el.style.left = `calc(${itemLeft} + (${itemWidth} / 2))`;
            el.style.transform = `translateX(-50%) translateY(${offset}px)`;
          }
        });
      }

      function nextStep() {
        if (currentStepIndex < steps.length - 1) {
          currentStepIndex++;
          renderStep(currentStepIndex);
          updateControlButtons();
        } else {
          pauseAnimation();
        }
      }

      function prevStep() {
        if (currentStepIndex > 0) {
          currentStepIndex--;
          renderStep(currentStepIndex);
          updateControlButtons();
        }
      }

      function togglePlay() {
        if (isPlaying) {
          pauseAnimation();
        } else {
          if (currentStepIndex >= steps.length - 1) {
            currentStepIndex = -1;
          }
          playAnimation();
        }
      }

      function playAnimation() {
        isPlaying = true;
        iconPlay.classList.add("hidden");
        iconPause.classList.remove("hidden");
        btnPlayPause.classList.replace("bg-blue-600", "bg-amber-600");
        btnPlayPause.classList.replace(
          "hover:bg-blue-500",
          "hover:bg-amber-500",
        );

        document.getElementById("btn-step-next").disabled = true;
        document.getElementById("btn-step-prev").disabled = true;

        nextStep();
        playInterval = setInterval(() => {
          if (currentStepIndex >= steps.length - 1) {
            pauseAnimation();
          } else {
            nextStep();
          }
        }, speedMs);
      }

      function pauseAnimation() {
        isPlaying = false;
        clearInterval(playInterval);

        iconPause.classList.add("hidden");
        iconPlay.classList.remove("hidden");
        btnPlayPause.classList.replace("bg-amber-600", "bg-blue-600");
        btnPlayPause.classList.replace(
          "hover:bg-amber-500",
          "hover:bg-blue-500",
        );

        updateControlButtons();
      }

      function updateControlButtons() {
        if (!isPlaying) {
          document.getElementById("btn-step-prev").disabled =
            currentStepIndex <= 0;
          document.getElementById("btn-step-next").disabled =
            currentStepIndex >= steps.length - 1;
        }
      }

      window.onload = init;
    </script>
  </body>
</html>
